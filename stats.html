<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>検証数字 — 字幕Preflight</title><link rel="stylesheet" href="styles.css"><style>.stats-main{width:min(900px,calc(100% - 32px));margin:60px auto}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:18px}.stat strong{display:block;font-size:2rem}.stat span{color:var(--muted)}@media(max-width:650px){.stats-grid{grid-template-columns:1fr 1fr}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">字</span><span>字幕Preflight</span></a><a class="ghost small" href="index.html">戻る</a></header><main class="stats-main"><div class="eyebrow">EXP003 DASHBOARD</div><h1>検証数字</h1><p>本文は記録せず、操作イベント数だけを測ります。</p><div class="stats-grid" id="grid"></div><section class="faq"><h2>判定</h2><p>最初の100ユニーク端末で、チェック実行率30%以上、SRT/レポート保存率10%以上、仕事利用意向5%以上を最低目安にします。届かなければ追加開発せず降格します。</p></section></main><script>const ms=[['view','ユニーク端末'],['check','チェック'],['autofix','自動修正'],['download_srt','SRT保存'],['download_report','レポート保存'],['paid_interest','仕事利用意向']],ns='bachikoljunior-blip.github.io',a='subtitle-preflight';Promise.all(ms.map(async([k,l])=>{let r=await fetch(`https://counterapi.com/api/${ns}/${a}/${k}?readOnly=true`),d=await r.json();return[l,+d.value||0]})).then(x=>grid.innerHTML=x.map(([l,v])=>`<article class="stat"><strong>${v}</strong><span>${l}</span></article>`).join('')).catch(()=>grid.textContent='取得できませんでした');</script></body></html>
