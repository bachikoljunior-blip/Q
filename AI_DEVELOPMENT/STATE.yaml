objective:
  id: Q-OPEN-WORLD-RPG
  statement: "Replace the published Q: STARTHREAD build with a mobile open-world RPG containing a broad, explorable natural world and other varied meaningful regions and systems."
  status: failed
  key_requirements:
    - open-world RPG rather than an arena action game
    - broad natural spaces plus varied settlements, ruins, caves, coasts, rivers, and mountains
    - touch-first smartphone play and GitHub Pages delivery
    - meaningful exploration, combat, progression, quests, persistence, and a finishable journey
    - performance and layout appropriate for iPhone SE third generation
  acceptance_evidence: AI_DEVELOPMENT/REQUIREMENTS.yaml

