schema_version: 1
objective: Q-OPEN-WORLD-RPG
task_contract:
  rigor: STRICT
  reason: "High-impact replacement of a deployed interactive product followed by protected-branch merge and public deployment."
  allowed_scope: "Replace game code, UI, procedural assets, tests, documentation, and release configuration needed for the requested mobile open-world RPG."
  invariants:
    - preserve relative GitHub Pages paths and offline-safe static hosting
    - preserve or migrate local settings and saves safely
    - ship no secrets, paid runtime dependency, unauthorized asset, or required external AI/API
    - keep test-only controls unreachable on the public hostname
    - preserve useful concurrent PR 3 lifecycle behavior in the replacement or record why a part is superseded
    - preserve the latest user concept and update only concept-affected reference benchmarks
    - do not weaken a valid benchmark or acceptance criterion to pass the current implementation
  recovery: "The complete_verified STARTHREAD baseline remains recoverable at ac6f57f. Runnable WILDBOUND checkpoints are merged and published iteratively at each project-changing session end, while failed and unverified acceptance items remain open until their own evidence passes."

requirements:
  - id: R-OPEN-WORLD
    authority: user_requirement
    statement: "The game is an open-world RPG, not the existing bounded arena action game."
  - id: R-NATURE
    authority: user_requirement
    statement: "The explorable world contains broad natural spaces and other varied meaningful environments, including forests, grasslands, rivers or wetlands, mountains, coast, caves, settlements, ruins, and landmark destinations where technically appropriate."
  - id: R-DENSITY
    authority: preserved_user_constraint
    statement: "World breadth must not become an empty map; exploration locations, encounters, rewards, traversal choices, and visual landmarks provide useful density."
  - id: R-PRESENTATION
    authority: preserved_user_constraint
    statement: "The natural-world replacement retains a grounded, realistic, cohesive premium presentation; changing the setting did not authorize default primitives, placeholder art, a low-poly product direction, or unrelated generated assets."
  - id: R-STORY
    authority: preserved_user_constraint
    statement: "The complete playable journey contains a deeply developed original story with character motivations and arcs, foreshadowing and payoff, escalation, climax, and resolution."
  - id: R-CONSEQUENCE
    authority: preserved_user_constraint
    statement: "Player choices produce later visible consequences in characters, quests, locations, resources, relationships, or endings, and accumulated actions matter more than a final menu choice."
  - id: R-BENCHMARKS
    authority: user_requirement
    statement: "Maintain element-specific high-quality reference games, evidence, transferable criteria, concept-change history, and the current quality gap in AI_DEVELOPMENT/REFERENCE_BENCHMARKS.yaml; use them for criticism and re-verification without copying protected expression."
  - id: R-RPG
    authority: derived_from_user_requirement
    statement: "The delivered game includes character growth, combat, quests or objectives, resources or equipment choices, persistence, failure/recovery, and a finishable main journey."
  - id: R-MOBILE
    authority: verified_project_requirement
    statement: "Touch-first smartphone browser play remains primary, with iPhone SE third generation as the representative small device and GitHub Pages as the public target."
  - id: R-ROUND-PHONE-GATE
    authority: user_requirement
    statement: "One implementation round is complete only after the exact candidate passes deterministic checks, iPhone SE third-generation landscape WebKit, and iPhone SE third-generation iOS Simulator Mobile Safari; main repeats both browser layers before public acceptance."
  - id: R-THREE
    authority: preserved_user_requirement
    statement: "Use Three.js for the three-dimensional third-person game while keeping runtime dependencies bundled locally."
  - id: R-PERFORMANCE
    authority: preserved_user_constraint
    statement: "Target stable 30 FPS in representative worst-case play on iPhone SE third generation, with automatic quality reduction and bounded memory/effects."
  - id: R-COMPLETE
    authority: preserved_user_constraint
    statement: "A player can start from a new save, learn the touch controls, explore, progress, reach an ending, continue or restart, and reload a valid save from the public Pages URL."
  - id: R-LICENSE
    authority: verified_project_constraint
    statement: "All shipped assets and libraries have verified compatible licenses and no unauthorized external runtime asset."

acceptance:
  - id: AC-WORLD
    requirement: [R-OPEN-WORLD, R-NATURE, R-DENSITY, R-PRESENTATION, R-BENCHMARKS]
    status: failed
    result: "A continuous navigable 3D world visibly includes multiple natural biomes and non-natural destinations, with discoverable landmarks and no required menu teleportation between the main regions."
    evidence: AI_DEVELOPMENT/REFERENCE_BENCHMARKS.yaml#current_quality_gap
  - id: AC-RPG-FLOW
    requirement: [R-RPG, R-COMPLETE, R-STORY]
    status: complete_unverified
    result: "Automated and user-surface checks cover tutorial, exploration, interaction, combat, character growth, main-objective transitions, defeat/recovery, final encounter, ending, and post-ending continuation or restart."
    evidence: "The published r3 checkpoint's npm run check executes the full happy-dom route, including three staged relationship quests, protected climax, relationship council, poise interruption, guardian phases/tactics, and legal navigation; PR 11 Quality passed and Pages serves the exact r3 source, while the prior focused real Chromium WebGL menu/world/dialogue/choice smoke and the full physical user-surface route remain the latest gameplay evidence"
  - id: AC-NARRATIVE
    requirement: [R-STORY, R-CONSEQUENCE, R-COMPLETE, R-BENCHMARKS]
    status: failed
    result: "The actual playable route proves character-motivated story escalation, planted information and payoff, at least one delayed consequence, accumulated ending state, and a resolved central conflict without placeholder dialogue or false choice."
    evidence: "Save-version-5 automated routes execute three choice-dependent multi-stage character quests, relationship-derived mechanical rewards, Ilya's planted-information payoff, protected climax gating, a strongest-bond council, journal changes, and accumulated endings; AI_DEVELOPMENT/REFERENCE_BENCHMARKS.yaml still records the compact text-led route and commercial-scale story/character-depth failure"
  - id: AC-COMBAT-AI
    requirement: [R-RPG, R-BENCHMARKS]
    status: failed
    result: "Recorded representative encounters show readable enemy anticipation/active/recovery phases, immediate synchronized feedback, distinct archetype decisions, legal terrain/range behavior, fair failure, and deterministic protected progression."
    evidence: "The published r3 checkpoint automates anticipation/active/recovery timing, poise interruption, three health phases, four guardian-specific tactics, terrain/water/leash/house/separation navigation rules, and progression locks. Blocked-geometry hit rejection plus real-user and physical-device combat readability replays remain absent, so this acceptance stays failed."
  - id: AC-PRESENTATION
    requirement: [R-PRESENTATION, R-BENCHMARKS]
    status: failed
    result: "Actual gameplay capture shows a unified realistic mobile presentation with authored materials, scale, lighting, atmosphere, character/enemy silhouettes, transitions, effects, and layered audio; no visible default primitives or placeholder content remains."
    evidence: "The published r3 checkpoint retains role-specific articulated humanoid and creature rigs and adds relationship/phase scenes under the 170-call/170,000-triangle guard; the public cloud browser verifies only the intended disabled-WebGL fallback, so real r3 gameplay inspection and the remaining authored-material, animation, environment, and audio bar are still open"
  - id: AC-TOUCH
    requirement: [R-MOBILE]
    status: prepared_not_executed
    result: "Landscape touch controls support simultaneous movement, camera, attack, dodge, and interaction without page gestures or stuck input at the iPhone SE viewport."
    evidence: "DOM input journey and small-viewport real WebGL layout passed; physical simultaneous-touch execution on iPhone SE third generation remains prepared_not_executed"
  - id: AC-ROUND-PHONE-GATE
    requirement: [R-MOBILE, R-ROUND-PHONE-GATE]
    status: complete_unverified
    result: "A single PR workflow blocks round completion unless deterministic checks, the approved iPhone SE 3 WebKit journey, and the iPhone SE 3 Mobile Safari journey all pass; the main publication verifier repeats both browser layers."
    evidence: "Workflow and harness source plus local deterministic validation are present on agent/round-phone-gates; the first GitHub WebKit run must create an inspectable baseline candidate, then the approved baseline and real Mobile Safari run must pass before merge."
  - id: AC-SAVE
    requirement: [R-COMPLETE]
    status: complete_unverified
    result: "Versioned save migration, malformed-data recovery, autosave, reload position/progression, and full reset execute without data corruption."
    evidence: "tests/core.test.mjs and tests/browser.mjs pass malformed data, v3/v4-to-v5 migration, forged council rejection, immediate decision and relationship persistence, autosave, and reset paths; physical browser reload remains prepared_not_executed"
  - id: AC-PERF
    requirement: [R-PERFORMANCE]
    status: prepared_not_executed
    result: "Rendering resolution, geometry, draw calls, entities, particles, audio voices, and updates are bounded; automatic quality reduction executes; physical-device 30 FPS remains required before claiming that device criterion."
    evidence: "The published r3 checkpoint passes at 1,556,151 release bytes and 198,958 JS+CSS bytes; its full route remains below the 170-call/170,000-triangle guard and reports 103 calls/114,950 triangles at the post-respawn final snapshot. Public source hashes match, while the prior real WebGL pass observed 94 calls/113,435 triangles and auto-quality fallback. Physical-device frame-time and memory evidence remain absent."
  - id: AC-PAGES
    requirement: [R-MOBILE, R-COMPLETE]
    status: complete_unverified
    result: "The intended revision loads from the public GitHub Pages URL with relative assets, no blocking runtime error, and a verified primary journey."
    evidence: "PR 11 passed Quality run 30719619021 and merged as product main 078796e. Pages serves wildbound-2026-08-01-r3; release.json, index meta, core.js, game.js, the font, and sw.js match, and public Chrome confirmed the exact title/module/private-test boundary plus the intended Japanese recovery screen. Its WebGL renderer is disabled, so the public 3D primary journey remains prepared_not_executed."
  - id: AC-LICENSE
    requirement: [R-LICENSE, R-THREE]
    status: complete_verified
    result: "Release validation identifies bundled Three.js version/license and reports no unknown-license or external runtime asset."
    evidence: "npm run validate: bundled Three.js 0.185.1 files matched exact MIT metadata and no external runtime asset was declared"
  - id: AC-BENCHMARK-TRACE
    requirement: [R-BENCHMARKS]
    status: complete_verified
    result: "Every required quality element has a small explicit reference set, evidence-backed selection reason, observable pass criteria, prohibited-copy boundary, concept-change rule, and honest current gap."
    evidence: AI_DEVELOPMENT/REFERENCE_BENCHMARKS.yaml
