    note: "The published r3 checkpoint's complete DOM route passes with poise interruption, guardian phases/specific tactics, legal navigation, progression, three decisions, staged relationship quests, failure/recovery, and an accumulated ending; physical interaction and benchmark depth remain open."
  - id: COMPLETE-JOURNEY
