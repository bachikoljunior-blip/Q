schema_version: 1
objective: Q-OPEN-WORLD-RPG
selection_status: complete_verified
updated_at: "2026-08-01T15:47:03+09:00"

authority:
  precedence:
    - latest explicit user concept
    - preserved non-conflicting user constraints
    - verified implementation and runtime evidence
    - benchmark-derived proposals
  update_rule: "When the user changes part of the concept, update only affected element mappings and criteria. Keep unaffected constraints and references. Never lower a valid bar to pass the current build."
  originality_rule: "Extract transferable design principles and quality tests only. Do not reproduce protected characters, fiction, maps, missions, UI layouts, music, visual signatures, dialogue, or assets."

active_concept:
  user_locked:
    genre: "Complete original third-person open-world action RPG"
    world: "A broad explorable natural world plus varied meaningful regions and systems; breadth must not become empty travel."
    presentation: "Grounded, realistic, cohesive, premium-quality direction preserved from the prior concept unless the user changes it."
    narrative: "A deeply developed playable story with strong characters, foreshadowing and payoff, meaningful choices, later consequences, escalation, climax, and ending."
    platform: "Static Three.js mobile web game for GitHub Pages; landscape touch-first; iOS Safari and Android Chrome; iPhone SE third generation is the primary device."
    product: "Finished journey rather than prototype, vertical slice, visual demo, or design document."
    technical: "Reliable versioned save/restore, no required external API, no secrets or placeholder content, relative subdirectory-safe paths, stable 30 FPS target on the primary physical device, and honest evidence labels."
  production_choices_not_user_locked:
    - "Q: WILDBOUND is the current working title."
    - "The current valley, characters, guardians, lore, route count, chapter structure, and ending count may change when quality or concept fit requires it."
  latest_concept_change:
    status: complete_verified
    change: "The previously specified dense ruined modern city was replaced by a broad open-world RPG containing extensive nature and other varied areas."
    preserved: "Third-person action RPG, realistic premium direction, deep story and consequences, mobile Three.js target, completion requirement, originality, performance, saving, and strict evidence honesty."
    affected_elements: [exploration, world_design, visual_direction, traversal, environment_audio, performance_budget]
    unaffected_elements: [story_craft, character_craft, choice_and_consequence, combat_readability, animation_quality, AI_readability, touch_usability, stability]

reference_set:
  - id: ghost_of_tsushima_dc
    title: "Ghost of Tsushima Director's Cut"
    primary_for: [movement, camera, combat_readability, environmental_navigation, visual_cohesion, environment_audio]
    reason: "The closest compact reference for readable third-person sword action, restrained HUD, landmark-led natural exploration, and a world whose wind, foliage, particles, weather, and sound all reinforce one direction."
    evidence:
      - type: developer_breakdown
        url: "https://blog.playstation.com/2021/01/12/how-stunning-visual-effects-bring-ghost-of-tsushima-to-life/"
        supports: "Sucker Punch documents interactive wind, automated large-scale effects, moving vegetation, weather, vistas, and selective hand placement used to guide exploration."
      - type: critic_and_player_reputation
        url: "https://www.metacritic.com/game/ghost-of-tsushima-directors-cut/"
        supports: "Long-running review record; use element-specific strengths, not an assertion that every system is best in class."
      - type: accessibility_falsification
        url: "https://caniplaythat.com/2020/07/29/ghost-of-tsushima-accessibility-review/"
        supports: "Known menu-state and overly strong assistance problems are explicit anti-benchmarks."
    do_not_copy: [samurai_identity, Tsushima, Guiding_Wind_presentation, combat_stances, iconography, missions, music, visual_motifs]

  - id: elden_ring
    title: "Elden Ring"
    primary_for: [exploration, world_topology, landmarks, discovery_rewards, enemy_telegraphs, boss_encounters]
    reason: "Its world repeatedly turns visible curiosity into routes, discoveries, meaningful rewards, and later reveals while preserving player agency. Its enemies make timing, anticipation, and recovery central."
    evidence:
      - type: aggregated_critical_evidence
        url: "https://www.metacritic.com/game/elden-ring/"
        supports: "Metascore 96 from 86 critic reviews on the recorded platform, with repeated praise for open-world exploration and mechanical precision."
      - type: industry_awards
        url: "https://www.metacritic.com/news/2022-game-award-winners-list/"
        supports: "The Game Awards 2022 Game of the Year, Best RPG, Best Game Direction, and Best Art Direction."
    do_not_copy: [lore, Lands_Between, sites_of_grace, enemies, bosses, map, architecture, itemization, interface]

  - id: witcher_3_complete
    title: "The Witcher 3: Wild Hunt — Complete Edition"
    primary_for: [story, characters, quest_design, choice_and_consequence, payoff, world_context]
    reason: "A durable reference for character-motivated quests, choices whose effects emerge later, consequences that alter people and situations, and accessible presentation without reducing narrative depth."
    evidence:
      - type: expert_review
        url: "https://gameinformer.com/games/the_witcher_3_wild_hunt/b/playstation4/archive/2015/05/12/the-witcher-3-wild-hunt-review-game-informer.aspx"
        supports: "The review scores it 9.75 and specifically identifies storytelling, choice, unpredictable consequence, voice work, and system explanation as strengths."
      - type: developer_and_award_record
        url: "https://www.cdprojekt.com/en/media/news/cd-projekt-red-ogloszony-kreatorem-kultury-podczas-gali-paszportow-polityki-2015/"
        supports: "CD Projekt records Game of the Year and Best RPG recognition, supporting its long-term benchmark status."
    do_not_copy: [characters, Witcher_setting, quests, dialogue, monsters, map, moral_dilemmas, music, UI]

  - id: tlou2_remastered
    title: "The Last of Us Part II Remastered"
    primary_for: [animation, physical_response, combat_audio, character_audio, enemy_AI, accessibility, visual_material_response]
    reason: "A high bar for state-driven character performance, readable close combat, coordinated enemy behavior, layered audio cues, broad accessibility, and expensive effects constrained by a fixed frame budget."
    evidence:
      - type: developer_technical_breakdown
        url: "https://www.naughtydog.com/blog/naughty_dog_at_siggraph_2020"
        supports: "Naughty Dog documents GPU-driven effects, systematic world interaction, low-level optimization, atmospheric rendering, baked ambient lighting, and a 30 FPS target on constrained hardware."
      - type: developer_AI_material
        url: "https://media.gdcvault.com/GDC%2B2021/Melee%2BAI%2Bin%2BThe%2BLast%2Bof%2BUs%2BPart%2BII.pdf"
        supports: "GDC material describes the melee AI building blocks and analysis tools."
      - type: official_accessibility_specification
        url: "https://www.playstation.com/en-us/games/the-last-of-us-part-ii/accessibility/"
        supports: "More than 60 settings plus explicit navigation, combat, audio, motor, hearing, and vision options."
    do_not_copy: [characters, apocalypse, factions, scenes, animations, dialogue, enemies, levels, sounds, UI]

  - id: genshin_ios
    title: "Genshin Impact (iOS)"
    primary_for: [touch_controls, mobile_HUD, simultaneous_input, quality_options, mobile_runtime_resilience]
    reason: "A mature native-mobile reference for fitting third-person traversal, camera, combat actions, context actions, HUD, and settings onto touch screens while supporting a large 3D world. It is a control and scaling reference, not a visual or performance parity target for a browser game."
    evidence:
      - type: official_device_requirements
        url: "https://support.hoyoverse.com/hc/en-us/articles/52089402685593-What-are-the-system-requirements-to-play-Genshin-Impact"
        supports: "HoYoverse publishes supported and recommended iOS hardware, OS, RAM, and storage tiers; iPhone 12/A13/4 GB is the current recommendation."
      - type: independent_touch_review
        url: "https://www.androidcentral.com/genshin-impact-review"
        supports: "Hands-on review calls the touch controls responsive enough for cross-platform play while also noting the disadvantage on small phones."
      - type: store_record
        url: "https://apps.apple.com/us/app/genshin-impact/id1517783697"
        supports: "Current iOS listing and supported-device evidence."
    do_not_copy: [characters, Teyvat, elemental_system, gacha, HUD_layout, icons, quests, art_style, music, monetization]

element_benchmarks:
  movement:
    references: [ghost_of_tsushima_dc, genshin_ios]
    pass_criteria:
      - "Movement begins and releases on the next simulation step for touch and keyboard; losing capture, focus, visibility, or orientation cannot leave movement stuck."
      - "Acceleration, turning, stopping, slopes, shallow water, dodge movement, and collision boundaries remain predictable without snapping, jitter, or unintended terrain penetration."
      - "A representative uninterrupted traversal can reach every required region without menu teleportation, soft lock, or invisible-wall surprise on a valid route."
  camera:
    references: [ghost_of_tsushima_dc, genshin_ios]
    pass_criteria:
      - "Move and look work simultaneously at 667 × 375 CSS pixels without pointer ownership conflicts."
      - "The player, immediate threat, and intended direction remain readable during movement, attack, dodge, elevation change, and boss encounters."
      - "The camera cannot enter terrain, water, geometry, or violent angle discontinuities in the representative route set."
  combat:
    references: [ghost_of_tsushima_dc, elden_ring]
    pass_criteria:
      - "Every damaging enemy action has distinguishable anticipation, active, and recovery phases with visual and/or audio evidence before damage."
      - "Attack, dodge, hit, damage, defeat, invulnerability, stamina failure, and boss phase states produce immediate and unambiguous feedback."
      - "Different required enemy archetypes demand meaningfully different spacing, timing, or response rather than only changed health, speed, and damage."
      - "Recorded encounter replays can explain each player hit from visible or audible information; attacks through blocked geometry or outside signaled range fail the gate."
  exploration:
    references: [elden_ring, ghost_of_tsushima_dc]
    pass_criteria:
      - "Each major region is announced by a visible or audible landmark before arrival and contains at least one authored discovery, traversal decision, encounter, and useful reward."
      - "Primary guidance supports orientation without turning exploration into following a permanent UI line; optional discoveries remain discoverable through world cues."
      - "No required travel segment exists solely to inflate map size, and repeated rewards do not make distinct discoveries interchangeable."
  world_design:
    references: [elden_ring, ghost_of_tsushima_dc]
    pass_criteria:
      - "Biomes differ through terrain, silhouette, vegetation, material, weather or atmosphere, audio, threat, and discovery—not palette alone."
      - "Routes, elevation, sightlines, shortcuts, interiors or caves, settlements, ruins, water, and boundaries form a coherent navigable whole."
      - "Every accessible authored destination has gameplay, story, recovery, progression, or orientation purpose."
  story:
    references: [witcher_3_complete]
    pass_criteria:
      - "The playable game establishes a concrete protagonist goal and stakes, escalates pressure, pays off planted information, reaches a climax, and resolves its central conflict."
      - "Essential story information is dramatized through play, character action, dialogue, or environment rather than being confined to an external design document."
      - "A complete playthrough contains no placeholder dialogue, abrupt unexplained objective, unresolved mandatory mystery, or ending unsupported by prior events."
  characters:
    references: [witcher_3_complete, tlou2_remastered]
    pass_criteria:
      - "Every central character has a distinct voice, credible ability and limitation, independent motivation, relationship, contradiction, and observable response to events."
      - "Character behavior remains consistent across quests and branches unless a clearly dramatized event changes it."
      - "Animation, framing, timing, and audio support important emotional beats rather than relying on text alone."
  choice_and_consequence:
    references: [witcher_3_complete]
    pass_criteria:
      - "Included choices change later character behavior, quest availability or resolution, locations, resources, relationships, or the ending; cosmetic acknowledgement alone is insufficient."
      - "At least one consequential decision pays off after intervening play, and endings reflect accumulated actions rather than only a final menu choice."
      - "Consequences are authored from this game's own themes and world logic, not adapted versions of benchmark quests."
  UI:
    references: [ghost_of_tsushima_dc, genshin_ios, tlou2_remastered]
    pass_criteria:
      - "At 667 × 375 CSS pixels, vital state, threat cues, objective context, dialogue, map, settings, pause, save state, and failure recovery remain readable without covering the central combat read."
      - "HUD elements appear only when useful, use a consistent visual language, respect safe areas, and never create an interactive-but-invisible or visible-but-inactive state."
      - "Text scaling, reduced motion, separate audio controls, and high-importance non-color cues are available where relevant."
  touch_controls:
    references: [genshin_ios]
    pass_criteria:
      - "Primary targets are at least 44 × 44 CSS pixels at the target viewport and remain reachable without hand overlap across simultaneous move, look, attack, dodge, and context interaction."
      - "Page scroll, double-tap zoom, selection, browser gestures, pointer cancellation, and orientation changes cannot corrupt game input."
      - "Small-phone user-surface testing covers rapid, repeated, held, cancelled, and simultaneous touches; DOM-only simulation is not accepted as physical-device evidence."
  visuals:
    references: [ghost_of_tsushima_dc, tlou2_remastered]
    pass_criteria:
      - "Final scenes contain no visible default primitives, placeholder geometry, unrelated asset styles, broken scale, missing material response, or unlit gameplay-critical object."
      - "Composition, landmark silhouette, atmosphere, lighting, vegetation motion, particles, character readability, and effects form one realistic direction within the mobile budget."
      - "Every quality tier preserves navigation, threat, interaction, and story readability even when effects and density are reduced."
  animation:
    references: [tlou2_remastered, ghost_of_tsushima_dc]
    pass_criteria:
      - "Idle, start, locomotion, turn, stop, attack anticipation/contact/recovery, dodge, hit, defeat, interaction, and important dialogue transitions preserve weight and do not pop between states."
      - "Contact timing agrees across pose, hit detection, effects, sound, and damage."
      - "Enemy and player silhouettes remain readable at the target mobile viewport."
  audio:
    references: [tlou2_remastered, ghost_of_tsushima_dc, witcher_3_complete]
    pass_criteria:
      - "Movement, attack, hit, incoming danger, dodge, interaction, pickup, discovery, region ambience, dialogue, boss state, failure, and victory have distinct correctly timed cues."
      - "Ambience identifies region and threat without masking dialogue or combat information; music supports escalation and resolution without repetitive short-loop fatigue."
      - "Browser unlock, interruption, mute, resume, voice limits, and separate volume behavior are verified on supported user surfaces."
  AI:
    references: [tlou2_remastered, elden_ring]
    pass_criteria:
      - "Each enemy has explicit local states and legal transitions for idle or patrol, perception, approach, telegraph, attack, recovery, disengage, interruption, defeat, and save/load handling where applicable."
      - "AI respects terrain, obstacles, attack range, progression locks, simultaneous entity limits, and protected story states."
      - "Different archetypes make distinct tactical decisions and remain deterministic under the test seed; merely varying constants fails the variety criterion."
  performance:
    references: [genshin_ios, tlou2_remastered]
    pass_criteria:
      - "The release records renderer size, device pixel ratio, frame-time distribution, draw calls, triangles, active entities, and memory proxies in a representative worst-case route."
      - "A physical iPhone SE third generation run sustains the agreed 30 FPS target with consistent pacing and no unbounded growth; headless, desktop, simulator, or native-app results cannot substitute."
      - "Automatic quality reduction is triggered by measured frame cost and preserves gameplay readability; it does not alter simulation outcomes."
  stability:
    references: [genshin_ios, tlou2_remastered]
    pass_criteria:
      - "Clean load, direct URL, offline reload after cache, save migration, malformed save recovery, autosave, pause, background, rotation, audio interruption, death, retry, ending, continued play, and full reset complete without uncaught error or progression loss."
      - "The public revision identifier matches the intended release, required assets load by relative path, and development-only controls are unreachable on the public hostname."

current_quality_gap:
  assessed_revision: "Local r2 candidate on agent/character-story-pass, based on main 1388c41cb50608e6eafa1f3b1dd7e88dcdec7259"
  assessment_status: complete_unverified
  evidence:
    - "Source inspection of index.html, src/actors.js, src/core.js, src/world.js, src/game.js, src/main.js, src/storage.js, and src/audio.js on 2026-08-01."
    - "npm run check passed on 2026-08-01: 28-file static/license validation, 7 deterministic core/world tests, and the happy-dom small-mobile journey through articulated combat, three persistent regional decisions, three choice-dependent playable aftermath scenes, protected climax, accumulated ending, defeat/recovery, and free roam."
    - "The headless visible-scene estimator reports 150 draw calls and 118,048 triangles for the final route. This is a deterministic budget guard, not a real renderer observation or physical-device performance result."
    - "The previous r1 real Chromium WebGL run at a 568 × 320 CSS-pixel touch viewport observed 94 draw calls, 113,435 triangles, quality tier 2, and 436,480 backing-store pixels. The r2 actor revision has not been visually replayed in a WebGL-capable browser in this environment."
    - "The locally re-subset Noto Sans JP Regular 400 WOFF covers all 545 non-icon non-ASCII code points used by the r2 game; ten intentional UI symbols remain on the system fallback stack."
    - "A deliberately slow SwiftShader run triggered automatic quality reduction to tier 1 and 284,000 backing-store pixels. SwiftShader timing is not physical-device performance evidence."
  gaps:
    - element: world_foundation
      severity: high
      status: complete_verified
      current: "A continuous deterministic terrain, seven landmark destinations, multiple named biomes, resources, water, day lighting, locally bundled Three.js runtime, generated seamless ground microtexture, dynamic detail visibility, and objective map exist and render in real WebGL."
      gap: "Biome identity still relies heavily on procedural geometry and color; route collision, interiors, authored discovery density, and premium realistic environment art remain below the reference bar."
    - element: movement_camera_touch
      severity: high
      status: complete_unverified
      current: "Fixed-step third-person movement, look drag, joystick, attack, dodge, interaction, pause recovery, input cancellation, safe-area UI, terrain-aware camera height, and automatic render scaling pass DOM integration; the actual menu, world, dialogue, and decision surfaces render in real WebGL at a smaller-than-target viewport."
      gap: "The real WebGL pass did not execute physical simultaneous touch. No physical-device evidence, geometry-aware camera collision, camera recenter option, control customization, or full multi-touch stress evidence exists."
    - element: combat_animation_AI
      severity: critical
      status: complete_unverified
      current: "Attack, dodge invulnerability, stamina, hit/death flow, bosses, deterministic idle/approach/windup/active/recovery enemy states, per-archetype range/timing/circling decisions, visual/audio telegraphs, and protected local test injection exist. Multi-part humanoid and creature rigs now animate locomotion, attacks, dodges, wing beats, and body gait, with distinct beast, stalker, sentinel, warden, and Crown silhouettes."
      gap: "The player still has one basic attack; procedural articulation is not authored skeletal animation; obstacle navigation, interruption/stagger, multi-phase guardian behavior, and a real-user combat-readability replay remain below the combat, animation, and AI reference criteria."
    - element: story_characters_choices
      severity: critical
      status: complete_unverified
      current: "Mira, Orin, and Ilya now have choice-dependent intervening scenes in changed locations: Mira tends the grove's consequence, Orin repairs the marsh water route, and Ilya's echo pays off the barrier's twelve-year cost. Save version 4 persists these reports, the Crown remains locked until all three are played, the journal and ending coda reflect them, and prior coherent saves migrate without losing completion."
      gap: "The route remains compact and mostly text-delivered; the three scenes are focused aftermath beats rather than multi-stage independent quests or schedules; relationship levels and quest availability do not branch; emotional animation, voiced performance, and commercial-scale escalation remain absent. The accumulated structure is stronger but still below the preserved story and character-depth bar."
    - element: visuals_audio
      severity: critical
      status: complete_unverified
      current: "Role-specific articulated traveler, Mira, Orin, Ilya, Crown, beast, stalker, sentinel, and warden rigs replace the former single-shape actor presentation. Silhouettes include cloaks, tools, quiver, halo, wings, antlers, armor plates, and gait/attack motion alongside the existing atmospheric lighting, generated ground/portrait assets, effects, cues, and music loop."
      gap: "The actor rigs remain procedural low-poly geometry rather than premium authored character assets, and this exact revision lacks real WebGL visual inspection. Buildings and vegetation still expose basic procedural construction; facial performance, authored material sets, layered regional ambience, dialogue performance, and sustained music development remain absent."
    - element: performance_stability
      severity: critical
      status: complete_unverified
      current: "The r2 candidate is 1,518,486 release bytes and 170,721 JS+CSS bytes, uses distance-bounded actor visibility, and passes a final-scene estimate of 150 calls/118,048 triangles plus the renderer pixel cap, automatic quality reduction, save cleaning, autosave, offline-local cache, relative paths, and full DOM journey. The prior r1 WebGL observation was 94 calls/113,435 triangles."
      gap: "The r2 estimates have not been confirmed by a real WebGL renderer. Before r2 publication, the latest verified public product remains wildbound-2026-08-01-r1; the available public cloud Chrome has WebGL disabled, and physical iPhone frame-time/memory, simultaneous-touch, and offline reload evidence remain absent."
  overall_result: failed
  rule: "Do not describe the current game as benchmark-complete. Preserve the reference bar after each iterative public checkpoint and repair the critical gaps before objective-complete release approval."

next_benchmark_driven_actions:
  - priority: P1
    action: "Run the complete route with simultaneous touch on a physical iPhone SE third generation; record frame-time distribution, memory proxies, orientation/background recovery, and visual findings."
  - priority: P2
    action: "Expand the telegraph/attack/recovery foundation with interruption, obstacle handling, guardian phases, and physical-device combat readability replays."
  - priority: P2
    action: "Deepen Mira, Orin, and Ilya beyond the new aftermath scenes with multi-stage independent quests, relationship-dependent availability, and stronger emotional performance while preserving the verified accumulated ending model."
  - priority: P2
    action: "Raise environment, character, animation, effects, and audio presentation without exceeding measured mobile budgets."
  - priority: P1
    action: "Before claiming the physical-device or benchmark-complete release criteria, run the complete route on the physical iPhone SE third generation. For every iterative publication, verify the deployed revision and representative primary journey through the public surface."

