schema_version: 1
criteria:
  - {id: AC-PAGES, result: "Public Pages URL loads every asset with no console error or external dependency", status: passed, evidence: "Public Chrome run at the Pages URL; zero app-origin warning/error logs; release validator found zero external runtime URLs."}
  - {id: AC-FLOW, result: "Player can learn, start, reach failure or victory, and restart without page reload", status: passed, evidence: "Public Chrome verified tutorial/start/pause/resume; deterministic interaction suite verified failure, victory, upgrades, and restart."}
  - {id: AC-TOUCH, result: "All play uses one pointer at 320 CSS px width without scrolling, selection or double-tap zoom", status: passed_with_device_limit, evidence: "Pointer drag passed on public canvas; mobile viewport/input rules and bounded canvas passed locally. Physical iPhone/Android hardware was not available."}
  - {id: AC-SAVE, result: "Versioned settings and records persist; malformed storage safely resets", status: passed, evidence: "Unit and DOM interaction tests."}
  - {id: AC-AUDIO, result: "Audio begins only after a gesture; mute persists; unavailable audio never blocks play", status: passed, evidence: "Gesture-gated public start plus settings/storage and unavailable-audio interaction tests."}
  - {id: AC-PERF, result: "DPR is capped, backing canvas stays under 2 million pixels, and entities/effects are bounded", status: passed, evidence: "Automated canvas-budget, source-bound, and release-size gates."}
  - {id: AC-COMPLETE, result: "Eight rifts, upgrade choices, two bosses, failure, final victory and replay exist", status: passed, evidence: "Deterministic complete-flow and checkpoint interaction tests."}
  - {id: AC-LICENSE, result: "No unlicensed third-party media or external runtime service is shipped", status: passed, evidence: "Asset manifest and release URL scan; all runtime art/audio are project-authored procedural assets."}
