name: Candidate evidence deep dive

on:
  push:
    branches: [main]
    paths:
      - 'research/tools/deep_dive_candidate.py'
      - 'research/candidate_queue/**'
      - '.github/workflows/candidate-deep-dive.yml'
  schedule:
    - cron: '19 21 * * 1'
  workflow_dispatch:

concurrency:
  group: candidate-evidence-deep-dive
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deep-dive first queued candidate
        run: python research/tools/deep_dive_candidate.py

      - name: Enforce no automatic build approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('research/deep_dive/latest.json').read_text(encoding='utf-8'))
          assert report['status'] in {
              'NO_CANDIDATE_TO_DEEP_DIVE', 'RESEARCH_ONLY',
              'MANUAL_FINAL_REVIEW_REQUIRED', 'REJECT_EXACT_DUPLICATE'
          }
          active = json.loads(Path('research/ACTIVE_CANDIDATE.json').read_text(encoding='utf-8'))
          assert active['status'] == 'NO_ACTIVE_CANDIDATE'
          assert active['build_approved'] is False
          assert not Path('product').exists() or not any(Path('product').rglob('*'))
          print({'status': report['status'], 'candidate': report.get('candidate', {}).get('candidate_id')})
          PY

      - name: Commit refreshed deep-dive evidence
        run: |
          if git diff --quiet -- research/deep_dive; then
            echo 'No deep-dive changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/deep_dive
          git commit -m 'Refresh candidate deep-dive evidence [skip ci]'
          git pull --rebase origin main
          git push
