name: Marketplace opportunity scan

on:
  push:
    branches: [main]
    paths:
      - 'research/tools/marketplace_signal_scan.py'
      - '.github/workflows/marketplace-scan.yml'
  schedule:
    - cron: '27 20 * * 1'
  workflow_dispatch:

concurrency:
  group: marketplace-opportunity-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run public marketplace signal scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/tools/marketplace_signal_scan.py

      - name: Validate scanner output and governance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('research/marketplace_scan/latest.json').read_text(encoding='utf-8'))
          assert data['status'] == 'RESEARCH_ONLY'
          assert isinstance(data['clusters'], list)
          assert Path('research/marketplace_scan/latest.md').is_file()
          active = json.loads(Path('research/ACTIVE_CANDIDATE.json').read_text(encoding='utf-8'))
          assert active['build_approved'] is False, 'marketplace scan must not auto-approve a product'
          assert not Path('product').exists() or not any(Path('product').rglob('*')), 'research scan must not create product code'
          print({
              'wordpress': len(data['wordpress']),
              'atlassian': len(data['atlassian']),
              'github_issues': len(data['github_issues']),
              'clusters': len(data['clusters']),
              'errors': len(data['errors']),
          })
          PY

      - name: Commit refreshed evidence
        run: |
          if git diff --quiet -- research/marketplace_scan; then
            echo 'No evidence changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/marketplace_scan
          git commit -m 'Refresh marketplace opportunity signals [skip ci]'
          git pull --rebase origin main
          git push
