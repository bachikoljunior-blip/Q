name: Quality floor

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-and-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Before the gates themselves: a silently inert gate and a passing gate both print
      # nothing and exit 0, so the gates are proved able to fail first.
      - name: Prove the gates can fail
        run: |
          node tools/validate-protocol.mjs --selftest
          for scenario in F2 F2_ASSET F5; do
            if node tools/floor-gates.mjs --deliberate-failure "$scenario"; then
              echo "deliberate $scenario failure did not fire"; exit 1
            fi
          done
      - name: Enforce continuity and review record
        run: node tools/floor-gates.mjs --base "${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}"
      - name: Validate Adaptive 2.2 continuity
        run: node tools/validate-protocol.mjs
      - name: Execute project checks
        run: npm run check
