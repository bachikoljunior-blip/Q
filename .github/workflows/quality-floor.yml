name: Quality floor

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-and-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce continuity and review record
        run: node tools/floor-gates.mjs --base "${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}"
      - name: Validate Adaptive 2.2 continuity
        run: node tools/validate-protocol.mjs
      - name: Execute project checks
        run: npm run check
