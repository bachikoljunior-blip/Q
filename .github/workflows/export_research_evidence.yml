name: Export research evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export_research_evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle current research evidence
        run: |
          mkdir -p evidence
          cp research/discovery_queue/latest.json evidence/discovery_queue.json
          cp research/discovery_queue/latest.md evidence/discovery_queue.md
          sha256sum research/discovery_queue/latest.json > evidence/discovery_queue.sha256
          cp research/discovery_queue/reviewed_2026-08-30.json evidence/reviewed_2026-08-30.json
          cp research/EXACT_WORKFLOW_REDUCTION_2026-08-30.md evidence/exact_workflow_reduction.md
          cp research/ACTIVE_CANDIDATE.json evidence/active_candidate.json
          cp research/app_store_scan/reviews.json evidence/app_store_reviews.json
          cp research/app_store_scan/reviews.md evidence/app_store_reviews.md
          cp research/app_store_scan/latest.json evidence/app_store_scan.json
          cp research/marketplace_scan/complaints.json evidence/wordpress_complaints.json
          cp research/marketplace_scan/latest.json evidence/wordpress_marketplace.json
          cp execution/CURRENT_WORK.json evidence/current_work.json
          cp scripts/check_execution_contract.py evidence/check_execution_contract.py
          cp tests/research-tools.smoke.py evidence/research-tools.smoke.py
          cp AGENTS.md evidence/AGENTS.md
          cp PROJECT_STATE.md evidence/PROJECT_STATE.md
          cp DECISIONS.md evidence/DECISIONS.md
      - uses: actions/upload-artifact@v4
        with:
          name: q-research-evidence-current
          path: evidence/
          if-no-files-found: error
          retention-days: 1
