name: Full discovery validation pass
on: [push, workflow_dispatch]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python scripts/check_prebuild_gate.py
          python scripts/check_continuation_contract.py
          python scripts/check_execution_contract.py
          python scripts/sync_status_docs.py
          python tests/research-tools.smoke.py
          node tests/script-overlap-audit.smoke.js
          python - <<'PY'
          from pathlib import Path
          assert 'Allow: /' in Path('robots.txt').read_text()
          assert 'product/script-overlap-audit/' in Path('sitemap.xml').read_text()
          assert '<meta name="robots" content="index,follow">' in Path('product/script-overlap-audit/index.html').read_text()
          print('full validation passed')
          PY
