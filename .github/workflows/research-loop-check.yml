name: Research loop checks
on:
  push:
    branches: [main]
    paths: ['research/**','execution/**','product/**','tests/**','scripts/**','.github/workflows/research-loop-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m py_compile scripts/*.py research/tools/*.py tests/research-tools.smoke.py
          python scripts/check_prebuild_gate.py
          python scripts/check_continuation_contract.py
          python scripts/check_execution_contract.py
          python tests/research-tools.smoke.py
          node tests/script-overlap-audit.smoke.js
