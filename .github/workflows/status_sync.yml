name: Validate candidate and completion status documentation
on:
  push:
    branches: [main]
    paths: ['research/ACTIVE_CANDIDATE.json','execution/CURRENT_WORK.json','PROJECT_STATE.md','START_HERE.md','README.md','AGENTS.md','index.html','scripts/sync_status_docs.py','.github/workflows/status_sync.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python scripts/sync_status_docs.py
          python scripts/check_prebuild_gate.py
          python scripts/check_continuation_contract.py
          python scripts/check_execution_contract.py
