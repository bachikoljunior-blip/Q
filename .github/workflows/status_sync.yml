name: Sync candidate status documentation

on:
  push:
    branches: [main]
    paths:
      - 'research/ACTIVE_CANDIDATE.json'
      - 'PROJECT_STATE.md'
      - 'scripts/sync_status_docs.py'
      - '.github/workflows/status_sync.yml'
  workflow_dispatch:

concurrency:
  group: q-status-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize docs from ACTIVE_CANDIDATE
        run: python scripts/sync_status_docs.py

      - name: Run prebuild and status checks
        run: |
          python scripts/check_prebuild_gate.py
          python -m py_compile scripts/sync_status_docs.py

      - name: Commit synchronized docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add START_HERE.md README.md AGENTS.md index.html
          if git diff --cached --quiet; then
            echo 'Status docs already synchronized.'
            exit 0
          fi
          git commit -m 'Synchronize human-facing candidate status'
          git pull --rebase origin main
          git push origin HEAD:main
