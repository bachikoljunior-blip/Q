name: IndexNow Jira Automation Guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'stats.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - '7f3a9d2c8e6b4a18b75d9f0c2e1a6b44.txt'
      - '.github/workflows/indexnow-jira-guard.yml'
  workflow_dispatch:

concurrency:
  group: indexnow-jira-automation-guard
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait until ownership key is public
        run: |
          key='7f3a9d2c8e6b4a18b75d9f0c2e1a6b44'
          key_url="https://bachikoljunior-blip.github.io/Q/${key}.txt"
          for i in {1..24}; do
            body=$(curl -fsS --max-time 15 "$key_url" || true)
            if [ "$body" = "$key" ]; then
              echo 'Ownership key is public'
              exit 0
            fi
            sleep 5
          done
          echo 'Ownership key was not published in time' >&2
          exit 1

      - name: Submit current product URLs
        run: |
          cat > /tmp/indexnow.json <<'JSON'
          {
            "host": "bachikoljunior-blip.github.io",
            "key": "7f3a9d2c8e6b4a18b75d9f0c2e1a6b44",
            "keyLocation": "https://bachikoljunior-blip.github.io/Q/7f3a9d2c8e6b4a18b75d9f0c2e1a6b44.txt",
            "urlList": [
              "https://bachikoljunior-blip.github.io/Q/",
              "https://bachikoljunior-blip.github.io/Q/privacy.html"
            ]
          }
          JSON
          code=$(curl -sS -o /tmp/indexnow-response -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow)
          cat /tmp/indexnow-response || true
          case "$code" in
            200|202) echo "IndexNow accepted: $code" ;;
            *) echo "IndexNow rejected: HTTP $code" >&2; exit 1 ;;
          esac
