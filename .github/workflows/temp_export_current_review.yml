name: Temporary export current queue and review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_export_current_review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: q-current-queue-review
          path: |
            research/discovery_queue/latest.json
            research/discovery_queue/reviewed_2026-08-30.json
            research/ACTIVE_CANDIDATE.json
            execution/CURRENT_WORK.json
          if-no-files-found: error
          retention-days: 1
