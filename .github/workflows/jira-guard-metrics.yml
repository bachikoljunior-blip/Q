name: Jira Automation Guard metrics

on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_jira_guard_metrics.py'
      - 'tests/jira-guard-metrics.smoke.py'
      - '.github/workflows/jira-guard-metrics.yml'

concurrency:
  group: jira-automation-guard-metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test gate calculations
        run: |
          python -m py_compile scripts/collect_jira_guard_metrics.py
          python tests/jira-guard-metrics.smoke.py

      - name: Collect production-only anonymous counts
        run: python scripts/collect_jira_guard_metrics.py

      - name: Validate scope and snapshot
        run: |
          python scripts/check_prebuild_gate.py
          python - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('metrics/jira-automation-guard/latest.json').read_text(encoding='utf-8'))
          assert latest['counter_action']=='jira-automation-guard-live-v1'
          assert latest['gate']['status'] in {'COLLECTING','PASS_SIGNAL','FAIL_SIGNAL','ACQUISITION_REVIEW'}
          active=json.loads(Path('research/ACTIVE_CANDIDATE.json').read_text(encoding='utf-8'))
          assert active['candidate_id']=='jira-automation-rule-guard'
          assert active['approval_scope']=='FREE_MVP_ONLY'
          print({'metrics': latest['gate']['status'], 'build_scope': active['approval_scope']})
          PY

      - name: Commit snapshot
        run: |
          git add metrics/jira-automation-guard
          if git diff --cached --quiet; then
            echo 'No metric changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Jira Guard validation metrics [skip ci]'
          git pull --rebase origin main
          git push
