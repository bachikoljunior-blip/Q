name: Finalize Jira Automation Guard state

on:
  workflow_run:
    workflows: ['Build and publish Jira Automation Guard']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: finalize-jira-automation-guard-state
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm published product and gate
        run: |
          python scripts/check_prebuild_gate.py
          node tests/jira-automation-guard.smoke.js
          python - <<'PY'
          import json
          from pathlib import Path
          active=json.loads(Path('research/ACTIVE_CANDIDATE.json').read_text(encoding='utf-8'))
          assert active['status']=='BUILD_APPROVED'
          assert active['candidate_id']=='jira-automation-rule-guard'
          assert 'Jira Automation Guard' in Path('index.html').read_text(encoding='utf-8')
          assert Path('core.js').is_file()
          print({'candidate': active['candidate_id'], 'release': 'present'})
          PY

      - name: Write canonical state
        run: python scripts/update_jira_guard_state.py

      - name: Validate updated continuity files
        run: |
          python - <<'PY'
          from pathlib import Path
          required=[
            'AGENTS.md','PROJECT_STATE.md','START_HERE.md','README.md','INCOME20_PROJECT.md','DECISIONS.md',
            'experiments/EXP005_JIRA_AUTOMATION_GUARD.md','execution/2026-08-30-marketplace-to-build.md'
          ]
          for name in required: assert Path(name).is_file(), name
          state=Path('PROJECT_STATE.md').read_text(encoding='utf-8')
          assert 'LIVE_FREE_MVP' in state
          assert 'Paid customers: 0' in state
          assert 'Revenue: ¥0' in state
          assert 'EXP004' in state and '重複90%超' in state
          assert 'Jira Automation Guard' in state
          print('continuity state valid')
          PY

      - name: Commit canonical state
        run: |
          git add \
            AGENTS.md PROJECT_STATE.md START_HERE.md README.md INCOME20_PROJECT.md DECISIONS.md \
            experiments/EXP005_JIRA_AUTOMATION_GUARD.md \
            execution/2026-08-30-marketplace-to-build.md
          if git diff --cached --quiet; then
            echo 'Canonical state already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Jira Automation Guard live free MVP [skip ci]'
          git pull --rebase origin main
          git push
