name: Snapshot EXP004 funnel metrics

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/snapshot_metrics.py'
      - '.github/workflows/metrics.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp004-metrics
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch public aggregate counters
        run: python scripts/snapshot_metrics.py

      - name: Commit snapshot only when it changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics/latest.json metrics/latest.md
          if git diff --cached --quiet; then
            echo 'No metric changes'
            exit 0
          fi
          git commit -m 'chore: snapshot EXP004 funnel metrics [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          echo 'Could not push metrics snapshot after retries' >&2
          exit 1
