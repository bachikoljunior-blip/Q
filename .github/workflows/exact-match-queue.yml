name: Exact-workflow candidate queue

on:
  push:
    branches: [main]
    paths:
      - 'research/tools/exact_match_queue.py'
      - '.github/workflows/exact-match-queue.yml'
  schedule:
    - cron: '53 20 * * 1'
  workflow_dispatch:

concurrency:
  group: exact-workflow-candidate-queue
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run exact-workflow search queue
        run: python research/tools/exact_match_queue.py

      - name: Enforce research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          queue = json.loads(Path('research/candidate_queue/latest.json').read_text(encoding='utf-8'))
          assert queue['status'] == 'RESEARCH_ONLY'
          assert queue['candidate_count'] >= 5
          for candidate in queue['candidates']:
              assert len(candidate['searches']) >= 12
              assert candidate['status'] in {
                  'DEEP_DIVE_REQUIRED', 'INSUFFICIENT_EVIDENCE',
                  'REJECT_FREE_CORE', 'REJECT_EXACT_DUPLICATE'
              }
          active = json.loads(Path('research/ACTIVE_CANDIDATE.json').read_text(encoding='utf-8'))
          assert active['build_approved'] is False
          assert active['status'] == 'NO_ACTIVE_CANDIDATE'
          assert not Path('product').exists() or not any(Path('product').rglob('*'))
          print({row['candidate_id']: row['status'] for row in queue['candidates']})
          PY

      - name: Commit refreshed queue
        run: |
          if git diff --quiet -- research/candidate_queue; then
            echo 'No queue changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/candidate_queue
          git commit -m 'Refresh exact-workflow candidate queue [skip ci]'
          git pull --rebase origin main
          git push
