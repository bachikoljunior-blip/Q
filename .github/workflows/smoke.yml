name: EXP003 smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate EXP003 static files
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser): pass
          for n in ['index.html','styles.css','app.js','privacy.html','stats.html']:
              assert Path(n).is_file(), n
          html=Path('index.html').read_text(encoding='utf-8'); P().feed(html)
          for i in ['srtInput','checkBtn','fixBtn','result','issues','proInterestBtn']:
              assert f'id="{i}"' in html, i
          js=Path('app.js').read_text(encoding='utf-8')
          for token in ['function parse','function inspect','function safeFix','subtitle-preflight']:
              assert token in js, token
          print('EXP003 static validation passed')
          PY
      - name: Serve and smoke HTTP
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          pid=$!; trap 'kill $pid' EXIT; sleep 1
          curl -fsS http://127.0.0.1:8765/ | grep -q '字幕Preflight'
          curl -fsS http://127.0.0.1:8765/app.js | grep -q 'safeFix'
      - name: Check counter endpoint
        run: |
          curl --retry 2 --connect-timeout 10 -fsS 'https://counterapi.com/api/bachikoljunior-blip.github.io/subtitle-preflight/view?readOnly=true' | python -c 'import json,sys; d=json.load(sys.stdin); assert "value" in d'