name: EXP002 smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js

      - name: Validate static files
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          required = [
              'index.html', 'styles.css', 'app.js', 'privacy.html',
              'stats.html', 'manifest.webmanifest', 'sw.js', 'sitemap.xml'
          ]
          for name in required:
              assert Path(name).is_file(), f'missing {name}'
          for name in ['index.html', 'privacy.html', 'stats.html']:
              Parser().feed(Path(name).read_text(encoding='utf-8'))
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          ET.parse('sitemap.xml')
          html = Path('index.html').read_text(encoding='utf-8')
          for element_id in ['projectForm', 'projectName', 'goal', 'nextAction', 'output', 'fileEditor']:
              assert f'id="{element_id}"' in html, f'missing DOM id: {element_id}'
          assert 'EXP002 hotfix' in html, 'first-file hotfix missing'
          print('static validation passed')
          PY

      - name: Serve and smoke HTTP
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for i in {1..10}; do
            curl -fsS http://127.0.0.1:8765/index.html >/tmp/index.html && break
            sleep 1
          done
          grep -q 'AIに同じ説明を' /tmp/index.html
          curl -fsS http://127.0.0.1:8765/app.js | grep -q 'buildFiles'
          curl -fsS http://127.0.0.1:8765/stats.html | grep -q '検証数字'

      - name: Check anonymous counter endpoint
        run: |
          curl --retry 2 --connect-timeout 10 -fsS \
            'https://counterapi.com/api/bachikoljunior-blip.github.io/tsuzukikara/pageview?readOnly=true' \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert "value" in data; print(data)'
