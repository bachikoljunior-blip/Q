name: Q governance gate
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Governance contracts
        run: |
          python scripts/check_prebuild_gate.py
          python scripts/check_continuation_contract.py
          python scripts/check_execution_contract.py
          python scripts/sync_status_docs.py
      - name: Static and product tests
        run: |
          python tests/research-tools.smoke.py
          node tests/script-overlap-audit.smoke.js
          grep -q '入力は端末内だけで処理' product/script-overlap-audit/index.html
          grep -q 'product/script-overlap-audit/' index.html
      - name: HTTP smoke
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/q-http.log 2>&1 &
          pid=$!; trap 'kill $pid' EXIT
          for i in {1..10}; do curl -fsS http://127.0.0.1:8765/product/script-overlap-audit/ >/tmp/app.html && break; sleep 1; done
          grep -q '台本かぶり監査' /tmp/app.html
          curl -fsS http://127.0.0.1:8765/product/script-overlap-audit/analysis-core.js >/dev/null
