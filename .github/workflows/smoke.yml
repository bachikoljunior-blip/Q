name: Q governance gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: q-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Enforce exact-match prebuild gate
        run: python scripts/check_prebuild_gate.py

      - name: Validate project files and public no-product page
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          required = [
              'index.html', 'robots.txt', 'sitemap.xml',
              'AGENTS.md', 'START_HERE.md', 'PROJECT_STATE.md', 'DECISIONS.md', 'README.md',
              'research/ACTIVE_CANDIDATE.json',
              'research/PREBUILD_GATE.md',
              'research/EXACT_MATCH_SWEEP_2026-08-30.md',
              'research/marketplace_scan/latest.json',
              'research/marketplace_scan/shortlist.json',
              'research/marketplace_scan/complaints.json',
              'experiments/EXP004_FBA_REIMBURSEMENT_COST_AUDIT.md',
              'scripts/check_prebuild_gate.py'
          ]
          for name in required:
              assert Path(name).is_file(), f'missing {name}'

          html = Path('index.html').read_text(encoding='utf-8')
          Parser().feed(html)
          assert '現在、公開中の商品はありません' in html
          assert 'noindex' in html
          assert 'FBA補てん原価監査 — Amazon.co.jp向け無料CSVチェッカー' not in html

          robots = Path('robots.txt').read_text(encoding='utf-8')
          assert 'Disallow: /' in robots

          root = ET.parse('sitemap.xml').getroot()
          assert not list(root), 'closed experiment URLs must not remain in sitemap'

          active = json.loads(Path('research/ACTIVE_CANDIDATE.json').read_text(encoding='utf-8'))
          allowed_nonbuild = {'NO_ACTIVE_CANDIDATE', 'RESEARCH_ONLY', 'OFFER_TEST'}
          if active['build_approved']:
              assert active['status'] in {'BUILD_APPROVED', 'LIVE_FREE_MVP', 'LIVE_PAID_PRODUCT'}
          else:
              assert active['status'] in allowed_nonbuild

          state = Path('PROJECT_STATE.md').read_text(encoding='utf-8')
          assert 'EXP004' in state and '終了' in state
          assert active['status'] in state, 'PROJECT_STATE must name the active status'

          experiment = Path('experiments/EXP004_FBA_REIMBURSEMENT_COST_AUDIT.md').read_text(encoding='utf-8')
          assert '状態: **CLOSED**' in experiment

          latest = json.loads(Path('research/marketplace_scan/latest.json').read_text(encoding='utf-8'))
          shortlist = json.loads(Path('research/marketplace_scan/shortlist.json').read_text(encoding='utf-8'))
          complaints = json.loads(Path('research/marketplace_scan/complaints.json').read_text(encoding='utf-8'))
          assert latest.get('status') in {'RESEARCH_ONLY', 'DISCOVERY_SIGNALS_ONLY'}
          assert isinstance(latest.get('clusters', latest.get('records', [])), list)
          assert shortlist['build_approved'] is False
          assert complaints['build_approved'] is False
          print(f"governance/static validation passed: {active['status']}")
          PY

      - name: Serve public page and smoke HTTP
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for i in {1..10}; do
            curl -fsS http://127.0.0.1:8765/index.html >/tmp/index.html && break
            sleep 1
          done
          grep -q '現在、公開中の商品はありません' /tmp/index.html
          grep -q 'noindex' /tmp/index.html
