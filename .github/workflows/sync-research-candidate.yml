name: Sync research-only candidate

on:
  push:
    branches: [main]
    paths:
      - 'research/deep_dive/**'
      - 'research/tools/sync_active_research.py'
      - '.github/workflows/sync-research-candidate.yml'
  workflow_dispatch:

concurrency:
  group: sync-research-only-candidate
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize research state
        run: python research/tools/sync_active_research.py

      - name: Enforce build prohibition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          active = json.loads(Path('research/ACTIVE_CANDIDATE.json').read_text(encoding='utf-8'))
          assert active['build_approved'] is False
          assert active['status'] in {'NO_ACTIVE_CANDIDATE', 'RESEARCH_ONLY'}
          assert not Path('product').exists() or not any(Path('product').rglob('*'))
          print({'status': active['status'], 'candidate_id': active['candidate_id']})
          PY

      - name: Commit state if changed
        run: |
          if git diff --quiet -- research/ACTIVE_CANDIDATE.json; then
            echo 'No active-research state change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ACTIVE_CANDIDATE.json
          git commit -m 'Sync research-only candidate state [skip ci]'
          git pull --rebase origin main
          git push
