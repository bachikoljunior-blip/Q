name: Validate game
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      standalone:
        description: Also generate and validate the optional offline HTML
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify deterministic asset provenance
        run: node scripts/generate-vault-assets.mjs --verify
      - name: Verify original score and effect asset provenance
        run: node scripts/verify-soundscape.mjs
      - name: Verify production entrypoint and fault sensitivity
        run: node scripts/verify-main-runtime.mjs
      - name: Preserve application-boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Q-main-runtime-evidence
          path: artifacts/main-runtime-report.json
          if-no-files-found: warn
      - name: Verify saved consultations through the production entrypoint
        run: node scripts/verify-gathering-runtime.mjs
      - name: Preserve consultation-boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Q-gathering-runtime-evidence
          path: artifacts/gathering-runtime-report.json
          if-no-files-found: error
      - name: Verify asset-slice journeys through the production entrypoint
        run: npm run test:vaults
      - name: Preserve asset-slice runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Q-vault-runtime-evidence
          path: artifacts/vault-runtime-report.json
          if-no-files-found: error
      - run: npm test
      - name: Verify bow grips, body clearance and saved shot poses
        run: node scripts/verify-archery-contact.mjs artifacts/archery-contact-report.json
      - name: Verify physical loaded-arrow surfaces
        run: node scripts/verify-loaded-arrow.mjs artifacts/loaded-arrow-report.json
      - name: Verify finite projectile forecast correctness and real terrain-read cost
        run: node scripts/verify-projectile-budget.mjs artifacts/projectile-budget-report.json
      - name: Verify actual conversation routes and native speaker framing
        run: node scripts/verify-dialogue-framing.mjs artifacts/dialogue-framing-report.json
      - name: Verify terrain contact, shallow stream and stable shadow geometry
        run: node scripts/verify-world-surfaces.mjs
      - name: Verify architecture contact and shared vertical collision bounds
        run: node scripts/verify-architecture-grounding.mjs artifacts/architecture-grounding-report.json
      - name: Verify settlement foundations, bridge contact and matching occlusion
        run: node scripts/verify-settlement-contact.mjs artifacts/settlement-contact-report.json
      - name: Verify loaded foliage and same-frame actor trail integration
        run: node scripts/verify-scene-integration.mjs . artifacts/scene-integration-report.json
      - name: Verify shared HDR loading, lighting and capability fallback
        run: node scripts/verify-sky-integration.mjs . artifacts/sky-integration-report.json
      - run: npm run test:journey
      - run: npm run test:crossing
      - run: npm run test:forge
      - run: npm run test:session
      - run: npm run test:expedition
      - run: npm run review:combat
      - name: Verify the review records are tracked
        run: git ls-files --error-unmatch release/combat-replays/combat-readability.json release/combat-replays/touch-input-comparison.json
      - run: npm run compare:touch
      - name: Verify the review records are current
        run: test -z "$(git status --porcelain --untracked-files=all -- release/combat-replays/combat-readability.json release/combat-replays/touch-input-comparison.json)"
      - run: npm run build
      - run: npm run package
      - run: npm run test:artifacts
      - name: Verify the web receipt is current
        run: |
          git ls-files --error-unmatch release/Q-web-manifest.json
          test -z "$(git status --porcelain --untracked-files=all -- release/Q-web-manifest.json)"
      - name: Select the verified fixed web stage
        id: web-stage
        run: node -e 'const fs=require("node:fs"); const stage=JSON.parse(fs.readFileSync("artifacts/latest-site.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT,`root=${stage.root}\n`);'
      - uses: actions/upload-artifact@v4
        with:
          name: Q-web
          path: |
            ${{ steps.web-stage.outputs.root }}/dist/
            release/Q-web-manifest.json
          if-no-files-found: error
      - name: Generate and verify optional offline HTML
        if: github.event_name == 'workflow_dispatch' && inputs.standalone
        run: npm run package:standalone && npm run test:standalone
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.standalone
        with:
          name: Q-standalone-optional
          path: |
            artifacts/Q-ash-pilgrim-standalone.html
            artifacts/standalone-encoding.json
          if-no-files-found: error
