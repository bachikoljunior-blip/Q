name: Validate game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:journey
      - run: npm run test:crossing
      - run: npm run test:forge
      - run: npm run test:session
      - run: npm run test:expedition
      - run: npm run build
      - run: npm run package
      - run: npm run test:artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Q-ash-pilgrim
          path: |
            dist/
            release/Q-ash-pilgrim.html
      - name: Verify the standalone build is current
        run: git diff --quiet --exit-code -- release/Q-ash-pilgrim.html

  repair_standalone:
    # Temporary, branch-only recovery. Removed before merge; never writes main.
    needs: game
    if: ${{ always() && needs.game.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/fix/projectile-frame-parity-20260914' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package
      - run: npm run test:artifacts
      - name: Save only the regenerated standalone on the exact recovery branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const branch='fix/projectile-frame-parity-20260914';
          if(process.env.GITHUB_REF_NAME!==branch)throw Error('Unexpected recovery branch');
          const git=(args)=>execFileSync('git',args,{encoding:'utf8',stdio:['ignore','pipe','pipe']}).trim();
          const auth='AUTHORIZATION: basic '+Buffer.from('x-access-token:'+process.env.GH_TOKEN).toString('base64');
          const remoteArgs=['-c','http.https://github.com/.extraheader='+auth];
          const expected=process.env.GITHUB_SHA;
          if(git(['rev-parse','HEAD'])!==expected)throw Error('Checkout moved');
          const remote=git([...remoteArgs,'ls-remote','origin','refs/heads/'+branch]).split(/\s+/)[0];
          if(remote!==expected)throw Error('Branch moved; preserve newer work');
          const file='release/Q-ash-pilgrim.html';
          git(['add','--',file]);
          let changed=false;
          try{git(['diff','--cached','--quiet','--exit-code','--',file]);}catch(e){if(e.status!==1)throw e;changed=true;}
          if(!changed){console.log('Standalone already current');process.exit(0);}
          if(git(['diff','--cached','--name-only'])!==file)throw Error('Unexpected staged files');
          git(['-c','user.name=Q build recovery','-c','user.email=q-build@users.noreply.github.com','commit','-m','Regenerate standalone from validated projectile source']);
          try{git([...remoteArgs,'push','origin','HEAD:refs/heads/'+branch]);}catch{throw Error('Non-force recovery push failed; inspect branch state');}
          console.log('Saved generated standalone at '+git(['rev-parse','HEAD']));
          NODE
