name: Temporary repair current review IDs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_repair_review_ids.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile review IDs to the canonical queue
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          queue_path = Path('research/discovery_queue/latest.json')
          review_path = Path('research/discovery_queue/reviewed_2026-08-30.json')
          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          review = json.loads(review_path.read_text(encoding='utf-8'))

          def key(item):
              return (item.get('source'), item.get('app') or item.get('plugin'), item.get('cluster'))

          queue_map = {}
          for row, item in enumerate(queue['items'], start=1):
              item_key = key(item)
              if item_key in queue_map:
                  raise SystemExit(f'duplicate queue semantic key: {item_key!r}')
              queue_map[item_key] = (row, item)

          seen = set()
          for disposition in review['dispositions']:
              item_key = key(disposition)
              if item_key not in queue_map:
                  raise SystemExit(f'review semantic key missing from queue: {item_key!r}')
              if item_key in seen:
                  raise SystemExit(f'duplicate review semantic key: {item_key!r}')
              seen.add(item_key)
              row, item = queue_map[item_key]
              disposition['row'] = row
              disposition['signal_id'] = item['signal_id']

          if seen != set(queue_map):
              raise SystemExit(f'review/queue semantic keys differ; missing={set(queue_map)-seen}')

          review['dispositions'].sort(key=lambda item: item['row'])
          review['source_file'] = 'research/discovery_queue/latest.json'
          review['source_schema_version'] = queue['schema_version']
          review['source_sha256'] = hashlib.sha256(queue_path.read_bytes()).hexdigest()
          review['source_generated_at_jst'] = queue['generated_at_jst']
          review['source_item_count'] = len(queue['items'])
          review['reviewed_item_count'] = len(review['dispositions'])
          review['reviewed_at_jst'] = '2026-08-30T19:56:00+09:00'
          review['promoted_signal_ids'] = [
              item['signal_id'] for item in review['dispositions']
              if item['decision'] != 'REJECTED'
          ]

          queue_ids = [item['signal_id'] for item in queue['items']]
          review_ids = [item['signal_id'] for item in review['dispositions']]
          if queue_ids != review_ids:
              raise SystemExit('repaired review still does not match queue order and signal IDs')

          review_path.write_text(json.dumps(review, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'repaired {len(review_ids)} review IDs')
          PY
      - name: Validate repaired state
        run: |
          python scripts/check_continuation_contract.py
          python scripts/check_prebuild_gate.py
          python scripts/check_execution_contract.py
      - name: Commit repaired review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/discovery_queue/reviewed_2026-08-30.json
          if git diff --cached --quiet; then
            echo 'No repair changes.'
            exit 0
          fi
          git commit -m 'Repair discovery review signal IDs against current queue'
          git pull --rebase origin main
          git push origin HEAD:main
