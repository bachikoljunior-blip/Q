name: Verify and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - icon.svg
      - manifest.webmanifest
      - sw.js
      - release.json
      - assets-manifest.json
      - assets/**
      - package.json
      - package-lock.json
      - src/**
      - vendor/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install verification dependencies
        run: npm ci
      - name: Enforce continuity and review record
        run: node tools/floor-gates.mjs --base "${{ github.event.before || 'origin/main^' }}"
      - name: Validate Adaptive 2.2 continuity
        run: node tools/validate-protocol.mjs
      - name: Run release gates
        run: npm run check
      - name: Prepare static artifact
        run: |
          mkdir _site
          cp index.html styles.css icon.svg manifest.webmanifest sw.js .nojekyll _site/
          cp -R src _site/src
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d vendor ]; then cp -R vendor _site/vendor; fi
          if [ -f release.json ]; then cp release.json _site/release.json; fi
          sed -i "s/__BUILD_REVISION__/${GITHUB_SHA}/g" _site/index.html _site/release.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6
      - name: Detect revision-enabled release
        id: revision
        run: |
          if [ -f release.json ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify served release identifier and page
        if: steps.revision.outputs.enabled == 'true'
        run: node tools/verify-public.mjs --url "${{ needs.deploy.outputs.page_url }}" --expected-id "${GITHUB_SHA}"
