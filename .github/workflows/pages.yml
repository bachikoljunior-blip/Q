name: Verify Pages publication

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - icon.svg
      - manifest.webmanifest
      - sw.js
      - release.json
      - assets-manifest.json
      - assets/**
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - tools/**
      - vendor/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-verification
  cancel-in-progress: true

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install verification dependencies
        run: npm ci
      - name: Prove the gates can fail
        run: |
          node tools/validate-protocol.mjs --selftest
          for scenario in F2 F2_ASSET F5; do
            if node tools/floor-gates.mjs --deliberate-failure "$scenario"; then
              echo "deliberate $scenario failure did not fire"; exit 1
            fi
          done
      - name: Enforce continuity and review record
        run: node tools/floor-gates.mjs --base "${{ github.event.before || 'origin/main^' }}"
      - name: Validate Adaptive 2.2 continuity
        run: node tools/validate-protocol.mjs
      - name: Run release gates
        run: npm run check
      - name: Verify served release identifier and page
        run: node tools/verify-public.mjs --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" --expected-file release.json --attempts 36 --delay-ms 5000
