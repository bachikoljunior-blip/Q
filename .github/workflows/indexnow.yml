name: Submit public pages to IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - '92a8f2c955d944a3bfa987d2f333eec1.txt'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Wait until the key is public
        run: |
          set -euo pipefail
          key_url='https://bachikoljunior-blip.github.io/Q/92a8f2c955d944a3bfa987d2f333eec1.txt'
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 15 "$key_url" | grep -qx '92a8f2c955d944a3bfa987d2f333eec1'; then
              exit 0
            fi
            sleep 10
          done
          echo 'IndexNow key was not visible after retries' >&2
          exit 1

      - name: Submit indexable pages
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          payload = {
              'host': 'bachikoljunior-blip.github.io',
              'key': '92a8f2c955d944a3bfa987d2f333eec1',
              'keyLocation': 'https://bachikoljunior-blip.github.io/Q/92a8f2c955d944a3bfa987d2f333eec1.txt',
              'urlList': [
                  'https://bachikoljunior-blip.github.io/Q/',
                  'https://bachikoljunior-blip.github.io/Q/guide.html',
                  'https://bachikoljunior-blip.github.io/Q/fba-reimbursement-cost.html',
                  'https://bachikoljunior-blip.github.io/Q/fba-reimbursement-deadline.html',
              ],
          }
          body = json.dumps(payload).encode('utf-8')
          endpoints = ['https://api.indexnow.org/indexnow', 'https://www.bing.com/indexnow']
          errors = []
          for endpoint in endpoints:
              for attempt in range(5):
                  try:
                      request = urllib.request.Request(
                          endpoint,
                          data=body,
                          method='POST',
                          headers={
                              'Content-Type': 'application/json; charset=utf-8',
                              'User-Agent': 'Q-EXP004-IndexNow/1.0',
                          },
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          if response.status in (200, 202):
                              print(f'accepted by {endpoint}: {response.status}')
                              raise SystemExit(0)
                          errors.append(f'{endpoint}: HTTP {response.status}')
                  except SystemExit:
                      raise
                  except urllib.error.HTTPError as exc:
                      errors.append(f'{endpoint}: HTTP {exc.code}')
                      if exc.code in (400, 403, 422):
                          break
                  except Exception as exc:
                      errors.append(f'{endpoint}: {exc!r}')
                  time.sleep(5 * (attempt + 1))
          raise SystemExit('IndexNow submission failed: ' + '; '.join(errors[-8:]))
          PY
